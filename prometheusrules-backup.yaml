  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"monitoring.coreos.com/v1","kind":"PrometheusRule","metadata":{"annotations":{},"labels":{"release":"prometheus"},"name":"api-replicas-test","namespace":"default"},"spec":{"groups":[{"name":"api.replicas","rules":[{"alert":"APIReplicasMismatch","annotations":{"description":"API deployment has 0 available replicas","summary":"API has 0 replicas"},"expr":"kube_deployment_status_replicas_available{deployment=\"api\",namespace=\"default\"} == 0","for":"1m","labels":{"severity":"critical"}}]}]}}
      prometheus-operator-validated: "true"
    creationTimestamp: "2026-04-23T10:45:59Z"
    generation: 1
    labels:
      release: prometheus
    name: api-replicas-test
    namespace: default
    resourceVersion: "263643"
    uid: 30fe5f3c-982d-49aa-9573-4b11c85f15e2
  spec:
    groups:
    - name: api.replicas
      rules:
      - alert: APIReplicasMismatch
        annotations:
          description: API deployment has 0 available replicas
          summary: API has 0 replicas
        expr: kube_deployment_status_replicas_available{deployment="api",namespace="default"}
          == 0
        for: 1m
        labels:
          severity: critical
